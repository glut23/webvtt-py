version: 2

updates:
  # the actions of the workflows, pinned to the commit of a release
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # only versions released a week before, so a bad release can be pulled
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # the pinned requirements of the documentation, also used by Read the Docs
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ['*']
    ignore:
      # sphinx-rtd-theme 3.1.0 requires docutils<0.23; remove this when a
      # release of the theme allows it, and bump docutils by hand with the
      # man page
      - dependency-name: docutils
        versions: ['>=0.23']
