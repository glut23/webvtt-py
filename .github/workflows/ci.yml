name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# the actions are pinned to the commit of a release, which Dependabot updates
jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          # files are written with the line separator of the platform, and
          # before Python 3.15 open() defaults to the cp1252 encoding
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.15'
          - os: macos-latest
            python-version: '3.15'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    # pip 26.2.2 no longer trusts the certificates of the eMudhra/emSign
    # CA incident
    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade 'pip>=26.2.2'

    - name: Install tox
      run: python -m pip install tox

    - name: Run the tests
      run: tox -e py,coverage

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml

  # the checks run once, apart from the tests, so their failures are told
  # apart from test failures
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # codestyle runs mypy for Python 3.10, as set in pyproject.toml, docs
        # fails on warnings and broken references, and build checks the
        # packages
        env: [codestyle, docs, build]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Upgrade pip
      run: python -m pip install --upgrade 'pip>=26.2.2'

    - name: Install tox
      run: python -m pip install tox

    - name: Run tox -e ${{ matrix.env }}
      run: tox -e ${{ matrix.env }}

    - name: Check manpage is up to date
      if: matrix.env == 'docs'
      run: |
        tox -e man
        git diff --exit-code -I '^\.TH' man/webvtt.1
